name: Voice runtime CI

on:
  push:
    branches: [main, "z/**"]
  pull_request:

permissions:
  contents: read

jobs:
  shared-repository-ci:
    uses: LouisVannobel/projetV0-pipelines/.github/workflows/reusable-repository-ci.yml@399df8dcb93a28734269ad11b63e847896684487

  python-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.4"
          python-version: "3.13.15"
      - run: uv sync --all-groups --frozen
      - run: uv run pytest -q
      - name: Run privileged Linux descriptor cases
        run: sudo env "PATH=$PATH" PROJETV0_PRIVILEGED_FILES_GATE=1 uv run pytest tests/unit/test_runtime_config.py tests/unit/test_qualified_profile.py tests/unit/test_production_wiring.py -q -k "linux_kernel or fifo or socket or grows"
      - run: uv run ruff check .
      - run: uv run mypy --strict src

  packaging-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.4"
          python-version: "3.13.15"
      - run: uv lock --check
      - run: uv sync --all-groups --frozen
      - name: Export and prove runtime and bundle parity
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run python scripts/export_runtime_contract.py --repo-root . --output-dir dist
          uv run pytest tests/contract/test_runtime_contract.py tests/unit/test_production_wiring.py::test_bundle_consumer_matches_literal_task11_golden_without_a_producer -q
          sudo env "PATH=$PATH" PROJETV0_PRIVILEGED_FILES_GATE=1 uv run pytest tests/unit/test_production_wiring.py::test_linux_kernel_accepts_real_task11_export_without_importing_producer -q
      - name: Validate the six pre-image artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import re
          import tarfile
          from pathlib import Path

          expected = {
              "runtime-contract.json",
              "qualified-deployment-profile-v1.schema.json",
              "qualification-candidate-profile-v1.schema.json",
              "qualification-override-v1.schema.json",
              "agent-a-bundle.tar.gz",
              "agent-a-bundle-v1.manifest.json",
          }
          root = Path("dist")
          entries = list(root.iterdir())
          assert all(path.is_file() for path in entries)
          assert {path.name for path in entries} == expected
          runtime = json.loads((root / "runtime-contract.json").read_bytes())
          assert runtime["schema_version"] == 1
          assert (root / "qualified-deployment-profile-v1.schema.json").read_bytes() == Path("deployment-profiles/qualified-v1.schema.json").read_bytes()
          assert (root / "qualification-candidate-profile-v1.schema.json").read_bytes() == Path("deployment-profiles/qualification-candidate-v1.schema.json").read_bytes()
          assert (root / "qualification-override-v1.schema.json").read_bytes() == Path("deployment-profiles/qualification-override-v1.schema.json").read_bytes()
          manifest_bytes = (root / "agent-a-bundle-v1.manifest.json").read_bytes()
          manifest = json.loads(manifest_bytes)
          assert set(manifest) == {
              "schema_version", "bundle_format", "bundle_sha256", "archive_sha256", "files"
          }
          assert manifest["schema_version"] == 1
          assert manifest["bundle_format"] == "projetv0-agent-bundle-v1"
          assert re.fullmatch(r"[0-9a-f]{64}", manifest["bundle_sha256"])
          archive = root / "agent-a-bundle.tar.gz"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest["archive_sha256"]
          with tarfile.open(archive, mode="r:gz") as bundle:
              assert all(member.isfile() for member in bundle.getmembers())
          PY
      - name: Upload pre-image handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-pre-image-${{ github.sha }}
          path: |
            dist/runtime-contract.json
            dist/qualified-deployment-profile-v1.schema.json
            dist/qualification-candidate-profile-v1.schema.json
            dist/qualification-override-v1.schema.json
            dist/agent-a-bundle.tar.gz
            dist/agent-a-bundle-v1.manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Build and run the required offline container smoke
        run: PROJETV0_CONTAINER_SMOKE=1 uv run pytest tests/integration/test_container_smoke.py -q
